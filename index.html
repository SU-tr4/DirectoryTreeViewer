  <meta property="og:title" content="DirectoryTreeViewer - フォルダ階層テキスト変換ツール">
  <meta property="og:description" content="フォルダをドラッグ＆ドロップするだけで、ツリー構造テキストやMarkdown形式のディレクトリマップを自動生成できるWebツールです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://su-tr4.github.io/DirectoryTreeViewer/">
  <meta property="og:image" content="https://su-tr4.github.io/DirectoryTreeViewer/ogp.png">
  <meta property="og:site_name" content="DirectoryTreeViewer">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DirectoryTreeViewer - フォルダ階層テキスト変換ツール">
  <meta name="twitter:description" content="フォルダをドラッグ＆ドロップするだけで、ツリー構造テキストやMarkdown形式のディレクトリマップを自動生成できるWebツールです。">
  <meta name="twitter:image" content="https://su-tr4.github.io/DirectoryTreeViewer/ogp.png">

  <!-- Google Fonts & Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="header-inner">
        <div class="header-title-group">
          <h1>DirectoryTreeViewer <span>v1.2.6</span></h1>
          <p class="subtitle">フォルダをドロップするだけでツリー構造テキスト/Markdownを自動生成</p>
        </div>
        <a href="https://github.com/SU-tr4/DirectoryTreeViewer" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub Repository">
          <svg height="24" width="24" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </header>

    <main class="main-content">
      <!-- ドロップエリア -->
      <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-inner">
          <div class="icon">📁</div>
          <p class="primary-text">ここにフォルダをドラッグ＆ドロップ</p>
          <p class="secondary-text">またはクリックしてフォルダを選択</p>
        </div>
        <input type="file" id="file-input" webkitdirectory directory multiple hidden>
      </div>

      <!-- コントロール・オプションエリア -->
      <div class="controls-panel">
        <div class="option-group">
          <label for="format-select">出力形式:</label>
          <select id="format-select">
            <option value="tree">ツリー形式 (├─ └─)</option>
            <option value="markdown">Markdown (リスト形式)</option>
            <option value="path">パス一覧 (相対パス)</option>
          </select>
        </div>

        <div class="option-group checkbox-group">
          <label>
            <input type="checkbox" id="ignore-git" checked> .git フォルダを除外
          </label>
          <label>
            <input type="checkbox" id="ignore-modules" checked> node_modules を除外
          </label>
        </div>
      </div>

      <!-- 出力エリア -->
      <div class="output-panel">
        <div class="output-header">
          <span class="output-title">出力結果</span>
          <div class="btn-group">
            <button id="reset-btn" class="btn-reset">🔄 リセット</button>
            <button id="copy-btn" class="btn-copy">📋 ログをコピー</button>
          </div>
        </div>
        <pre><code id="output-text">ここにツリー構造が出力されます...</code></pre>
      </div>
    </main>

      <p>DirectoryTreeViewer &copy; 2026 - Powered by HTML / CSS / JS (Client-side execution)</p>

  </div>

</body>
</html>
